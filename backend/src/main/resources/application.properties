spring.application.name=utp-backend
server.port=8080

# H2 en archivo: los datos sobreviven a reinicios (carpeta backend/data)
spring.datasource.url=jdbc:h2:file:./data/utpdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola H2 para inspeccionar tablas en desarrollo: http://localhost:8080/h2-console
spring.h2.console.enabled=true
