spring.application.name=utp-backend
server.port=8080

# --- MySQL ---
# La base "utp_db" se crea sola si no existe (createDatabaseIfNotExist=true).
# Usuario y clave: variables de entorno DB_USER / DB_PASSWORD, o cambia los valores por defecto de abajo.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:utp_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate crea y actualiza las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- JWT ---
# Clave de firma (mínimo 32 caracteres). En producción define la variable JWT_SECRET.
app.jwt.secret=${JWT_SECRET:utp-clave-secreta-de-desarrollo-cambiar-0123456789}
app.jwt.horas=12

# --- Archivos subidos (material pedagógico) ---
# Se guardan en disco; en MySQL queda solo la información de cada archivo.
app.storage.dir=${STORAGE_DIR:./uploads}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
